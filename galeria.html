<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Pack - Galería Visual</title>
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Fuente de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">

    <!-- Estilos generales compartidos -->
    <link rel="stylesheet" href="style.css">

<body>

    <!-- ENCABEZADO -->
    <header class="header-container transition_2">
      <div class="header-text">
        <h1 class="logo-titulo">Golden Pack</h1>
        <p class="logo-eslogan">El toque elegante y dorado para la presentación de tus creaciones</p>
        <div class="menu">
          <button class="caida-menu">Menú</button>
          <div class="contenido-menu">

            <a href="galeria.html">Galería</a>

        </div>
      </div>
      <img src="logo.png" alt="Logo Golden Pack" class="header-logo">

    <!-- CONTENIDO PRINCIPAL (GALERÍA) -->
    <main class="catalog-container">
      <h2 class="section-title transition_1">Galería de Modelos</h2>
      <div class="grid" id="galeria-grid"></div>

    <!-- MODAL REUTILIZADO PARA AMPLIAR IMÁGENES -->

      <div class="container-2" style="text-align: center;">
        <button class="btn-cerrar">&times;</button>

    </div>

    <!-- PIE DE PÁGINA -->
    <footer class="transition_2">
      <p>&copy; 2026 Golden Pack - Todos los derechos reservados.</p>
      <div class="legal-links">
        <a href="salubridad.html" target="_blank" rel="noopener noreferrer">Normas de Salubridad</a> | 
        <a href="terminos.html" target="_blank" rel="noopener noreferrer">Términos de Servicio</a>

    <!-- SCRIPT ÚNICO -->
    <script src="script.js"></script>
